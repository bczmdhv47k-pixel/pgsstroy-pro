<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PGSSTROY.PRO</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f3f5f8;
  color:#151a24
}
header{
  background:#111827;
  color:white;
  padding:28px 18px;
}
header h1{margin:0;font-size:30px}
header p{margin:8px 0 0;color:#b8c0ce}
main{max-width:900px;margin:auto;padding:18px}
.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 2px 10px #0000000d;
}
h2{margin:0 0 16px;font-size:21px}
h3{margin:18px 0 10px}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px
}
input,select,button{
  width:100%;
  padding:14px;
  border-radius:12px;
  font-size:16px;
}
input,select{
  border:1px solid #d5dbe5;
  background:white
}
button{
  border:0;
  background:#111827;
  color:white;
  font-weight:700;
  cursor:pointer
}
button.secondary{
  background:#e8ebf0;
  color:#111827
}
.result{
  margin-top:15px;
  padding:16px;
  background:#eef2f7;
  border-radius:12px;
  font-size:18px;
  font-weight:700
}
.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:8px 0;
  border-bottom:1px solid #dfe3e9
}
.object{
  padding:14px;
  background:#f5f7fa;
  border-radius:12px;
  margin-top:10px
}
.small{color:#697386;font-size:14px}
.total{
  font-size:24px;
  font-weight:800;
  margin-top:12px
}
.menu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}
.menu button{
  min-height:70px;
  background:#eef1f5;
  color:#111827
}
.hidden{display:none}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .menu{grid-template-columns:repeat(2,1fr)}
  main{padding:12px}
}
</style>
</head>

<body>

<header>
  <h1>PGSSTROY.PRO</h1>
  <p>Строительный сервис и инженерные расчёты</p>
</header>

<main>

<!-- МЕНЮ -->
<section class="card">
  <h2>Инструменты</h2>
  <div class="menu">
    <button onclick="show('objects')">🏗️ Объекты</button>
    <button onclick="show('concrete')">🧱 Бетон</button>
    <button onclick="show('rebar')">🔩 Арматура</button>
    <button onclick="show('materials')">🪨 Материалы</button>
    <button onclick="show('formwork')">🪵 Опалубка</button>
    <button onclick="show('cost')">💰 Стоимость</button>
  </div>
</section>

<!-- ОБЪЕКТЫ -->
<section id="objects" class="card">
  <h2>🏗️ Объекты</h2>

  <div class="grid">
    <input id="objectName" placeholder="Название объекта">
    <input id="objectAddress" placeholder="Адрес">
  </div>

  <br>
  <button onclick="addObject()">Добавить объект</button>

  <div id="objectsList"></div>
</section>

<!-- БЕТОН -->
<section id="concrete" class="card">
  <h2>🧱 Расчёт бетона</h2>

  <div class="grid">
    <input id="cL" type="number" step="0.01" placeholder="Длина, м">
    <input id="cW" type="number" step="0.01" placeholder="Ширина, м">
    <input id="cT" type="number" step="0.001" placeholder="Толщина, м">
    <input id="cReserve" type="number" value="5" placeholder="Запас, %">
    <input id="cPrice" type="number" placeholder="Цена бетона, ₽/м³">
  </div>

  <br>
  <button onclick="calcConcrete()">Рассчитать</button>

  <div id="concreteResult"></div>
</section>

<!-- АРМАТУРА -->
<section id="rebar" class="card">
  <h2>🔩 Расчёт арматуры</h2>

  <div class="grid">
    <input id="rL" type="number" step="0.01" placeholder="Длина конструкции, м">
    <input id="rW" type="number" step="0.01" placeholder="Ширина конструкции, м">
    <input id="rStep" type="number" step="0.01" placeholder="Шаг сетки, м">
    <select id="rD">
      <option value="6">Ø6 мм</option>
      <option value="8">Ø8 мм</option>
      <option value="10">Ø10 мм</option>
      <option value="12" selected>Ø12 мм</option>
      <option value="14">Ø14 мм</option>
      <option value="16">Ø16 мм</option>
      <option value="18">Ø18 мм</option>
      <option value="20">Ø20 мм</option>
      <option value="22">Ø22 мм</option>
      <option value="25">Ø25 мм</option>
      <option value="28">Ø28 мм</option>
      <option value="32">Ø32 мм</option>
    </select>
    <input id="rLayers" type="number" value="1" min="1" placeholder="Количество сеток">
    <input id="rOverlap" type="number" value="0.6" step="0.1" placeholder="Нахлёст, м">
    <input id="rBar" type="number" value="11.7" step="0.1" placeholder="Длина стержня, м">
    <input id="rPrice" type="number" placeholder="Цена арматуры, ₽/т">
  </div>

  <br>
  <button onclick="calcRebar()">Рассчитать</button>

  <div id="rebarResult"></div>
</section>

<!-- МАТЕРИАЛЫ -->
<section id="materials" class="card">
  <h2>🪨 ПГС / песок / щебень</h2>

  <div class="grid">
    <input id="mVolume" type="number" step="0.01" placeholder="Объём, м³">
    <input id="mDensity" type="number" step="10" placeholder="Плотность, кг/м³">
    <input id="mReserve" type="number" value="5" placeholder="Запас, %">
    <input id="mPrice" type="number" placeholder="Цена, ₽/т">
  </div>

  <br>
  <button onclick="calcMaterial()">Рассчитать</button>

  <div id="materialResult"></div>
</section>

<!-- ОПАЛУБКА -->
<section id="formwork" class="card">
  <h2>🪵 Опалубка</h2>

  <div class="grid">
    <input id="fL" type="number" step="0.01" placeholder="Длина, м">
    <input id="fH" type="number" step="0.01" placeholder="Высота, м">
    <input id="fBoard" type="number" step="0.01" value="0.15" placeholder="Ширина доски, м">
    <input id="fBoardL" type="number" step="0.1" value="6" placeholder="Длина доски, м">
    <input id="fReserve" type="number" value="10" placeholder="Запас, %">
    <input id="fPrice" type="number" placeholder="Цена доски, ₽">
  </div>

  <br>
  <button onclick="calcFormwork()">Рассчитать</button>

  <div id="formworkResult"></div>
</section>

<!-- СТОИМОСТЬ -->
<section id="cost" class="card">
  <h2>💰 Стоимость работ и материалов</h2>

  <div class="grid">
    <input id="costConcrete" type="number" placeholder="Бетон, ₽">
    <input id="costRebar" type="number" placeholder="Арматура, ₽">
    <input id="costMaterial" type="number" placeholder="Материалы, ₽">
    <input id="costFormwork" type="number" placeholder="Опалубка, ₽">
    <input id="costWork" type="number" placeholder="Работа, ₽">
    <input id="costDelivery" type="number" placeholder="Доставка, ₽">
  </div>

  <br>
  <button onclick="calcCost()">Рассчитать смету</button>

  <div id="costResult"></div>
</section>

</main>

<script>

let objects = JSON.parse(localStorage.getItem("pgs_objects") || "[]");

function show(id){
  document.querySelectorAll("main section[id]").forEach(x=>{
    x.classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}

function money(x){
  return Math.round(x).toLocaleString("ru-RU")+" ₽";
}

function addObject(){

  const name=document.getElementById("objectName").value.trim();
  const address=document.getElementById("objectAddress").value.trim();

  if(!name){
    alert("Введите название объекта");
    return;
  }

  objects.push({
    name:name,
    address:address,
    date:new Date().toLocaleDateString("ru-RU")
  });

  localStorage.setItem("pgs_objects",JSON.stringify(objects));

  document.getElementById("objectName").value="";
  document.getElementById("objectAddress").value="";

  renderObjects();
}

function renderObjects(){

  const box=document.getElementById("objectsList");

  if(objects.length===0){
    box.innerHTML='<p class="small">Объекты пока не добавлены.</p>';
    return;
  }

  box.innerHTML=objects.map((o,i)=>`
    <div class="object">
      <b>🏗️ ${o.name}</b>
      <div class="small">${o.address || "Адрес не указан"}</div>
      <div class="small">Создан: ${o.date}</div>
      <br>
      <button class="secondary" onclick="deleteObject(${i})">Удалить</button>
    </div>
  `).join("");
}

function deleteObject(i){
  if(confirm("Удалить объект?")){
    objects.splice(i,1);
    localStorage.setItem("pgs_objects",JSON.stringify(objects));
    renderObjects();
  }
}

function calcConcrete(){

  const L=+document.getElementById("cL").value;
  const W=+document.getElementById("cW").value;
  const T=+document.getElementById("cT").value;
  const reserve=+document.getElementById("cReserve").value || 0;
  const price=+document.getElementById("cPrice").value || 0;

  if(!L||!W||!T){
    alert("Введите длину, ширину и толщину");
    return;
  }

  const volume=L*W*T;
  const total=volume*(1+reserve/100);
  const cost=total*price;

  document.getElementById("concreteResult").innerHTML=`
    <div class="result">
      <div class="row"><span>Объём</span><span>${volume.toFixed(2)} м³</span></div>
      <div class="row"><span>Запас</span><span>${reserve}%</span></div>
      <div class="row"><span>Заказать</span><span>${total.toFixed(2)} м³</span></div>
      ${price ? `<div class="total">${money(cost)}</div>` : ""}
    </div>
  `;
}

function calcRebar(){

  const L=+document.getElementById("rL").value;
  const W=+document.getElementById("rW").value;
  const step=+document.getElementById("rStep").value;
  const d=+document.getElementById("rD").value;
  const layers=+document.getElementById("rLayers").value || 1;
  const overlap=+document.getElementById("rOverlap").value || 0;
  const barLength=+document.getElementById("rBar").value || 11.7;
  const price=+document.getElementById("rPrice").value || 0;

  if(!L||!W||!step){
    alert("Введите размеры конструкции и шаг");
    return;
  }

  const barsW=Math.ceil(W/step)+1;
  const barsL=Math.ceil(L/step)+1;

  const totalLength=
    ((barsW*L)+(barsL*W)+
    (barsW+barsL)*overlap)*layers;

  const kgPerM=d*d/162;
  const weightKg=totalLength*kgPerM;
  const weightT=weightKg/1000;
  const bars=Math.ceil(totalLength/barLength);
  const cost=weightT*price;

  document.getElementById("rebarResult").innerHTML=`
    <div class="result">
      <div class="row"><span>Стержней по длине</span><span>${barsL} шт.</span></div>
      <div class="row"><span>Стержней по ширине</span><span>${barsW} шт.</span></div>
      <div class="row"><span>Общий метраж</span><span>${totalLength.toFixed(1)} м</span></div>
      <div class="row"><span>Масса Ø${d}</span><span>${weightKg.toFixed(1)} кг</span></div>
      <div class="row"><span>Стержней по ${barLength} м</span><span>${bars} шт.</span></div>
      ${price ? `<div class="total">${money(cost)}</div>` : ""}
    </div>
  `;
}

function calcMaterial(){

  const volume=+document.getElementById("mVolume").value;
  const density=+document.getElementById("mDensity").value;
  const reserve=+document.getElementById("mReserve").value || 0;
  const price=+document.getElementById("mPrice").value || 0;

  if(!volume||!density){
    alert("Введите объём и плотность");
    return;
  }

  const totalVolume=volume*(1+reserve/100);
  const kg=totalVolume*density;
  const tons=kg/1000;
  const cost=tons*price;

  document.getElementById("materialResult").innerHTML=`
    <div class="result">
      <div class="row"><span>Объём с запасом</span><span>${totalVolume.toFixed(2)} м³</span></div>
      <div class="row"><span>Масса</span><span>${kg.toFixed(0)} кг</span></div>
      <div class="row"><span>Количество</span><span>${tons.toFixed(2)} т</span></div>
      ${price ? `<div class="total">${money(cost)}</div>` : ""}
    </div>
  `;
}

function calcFormwork(){

  const L=+document.getElementById("fL").value;
  const H=+document.getElementById("fH").value;
  const board=+document.getElementById("fBoard").value;
  const boardL=+document.getElementById("fBoardL").value;
  const reserve=+document.getElementById("fReserve").value || 0;
  const price=+document.getElementById("fPrice").value || 0;

  if(!L||!H||!board||!boardL){
    alert("Введите размеры опалубки");
    return;
  }

  const area=2*L*H;
  const boardArea=board*boardL;
  const quantity=Math.ceil((area/boardArea)*(1+reserve/100));
  const cost=quantity*price;

  document.getElementById("formworkResult").innerHTML=`
    <div class="result">
      <div class="row"><span>Площадь опалубки</span><span>${area.toFixed(2)} м²</span></div>
      <div class="row"><span>Доска ${board}×${boardL} м</span><span>${quantity} шт.</span></div>
      ${price ? `<div class="total">${money(cost)}</div>` : ""}
    </div>
  `;
}

function calcCost(){

  const values=[
    "costConcrete",
    "costRebar",
    "costMaterial",
    "costFormwork",
    "costWork",
    "costDelivery"
  ];

  const total=values.reduce((sum,id)=>{
    return sum+(+document.getElementById(id).value||0);
  },0);

  document.getElementById("costResult").innerHTML=`
    <div class="result">
      <div class="row"><span>Бетон</span><span>${money(+costConcrete.value||0)}</span></div>
      <div class="row"><span>Арматура</span><span>${money(+costRebar.value||0)}</span></div>
      <div class="row"><span>Материалы</span><span>${money(+costMaterial.value||0)}</span></div>
      <div class="row"><span>Опалубка</span><span>${money(+costFormwork.value||0)}</span></div>
      <div class="row"><span>Работа</span><span>${money(+costWork.value||0)}</span></div>
      <div class="row"><span>Доставка</span><span>${money(+costDelivery.value||0)}</span></div>
      <div class="total">ИТОГО: ${money(total)}</div>
    </div>
  `;
}

renderObjects();
show("objects");

</script>

</body>
</html>
